name: Deploy Frontend React

on:
  push:
    branches: ['master'] # Confirme se é 'main' ou 'master'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Loga no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Cria a imagem usando seu Dockerfile (O build do Angular acontece AQUI, dentro do Docker)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Lembre de ajustar o nome da imagem aqui para bater com o do seu compose
          tags: ${{ secrets.DOCKER_USERNAME }}/cine-ai:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.yml'
          target: '/app/cine-ai/' # Pasta onde ficará no servidor

      # 5. Conecta no VPS e atualiza
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app/cine-ai/

            # Baixa a nova versão da imagem (que acabamos de subir)
            docker compose pull

            # Recria o container com a nova versão
            docker compose up -d --remove-orphans

            # Remove imagens antigas para não lotar o disco do servidor
            docker image prune -f